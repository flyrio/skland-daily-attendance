name: Sync upstream

on:
  schedule:
    # 在每日签到工作流（16:00 UTC）之前同步上游更新
    - cron: '55 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync from upstream
        env:
          UPSTREAM_REPO: AEtherside/skland-daily-attendance
          UPSTREAM_BRANCH: main
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream "https://github.com/${UPSTREAM_REPO}.git"
          else
            git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          fi

          git fetch --prune upstream "${UPSTREAM_BRANCH}"
          git fetch origin "${UPSTREAM_BRANCH}"

          git checkout "${UPSTREAM_BRANCH}"

          # 记录合并前本地版本，用于之后恢复本仓库自己的工作流文件
          pre_merge="$(git rev-parse HEAD)"

          # 优先 fast-forward；如本仓库存在自定义提交则回退为普通 merge
          # 使用 -X ours 策略：冲突时保留本仓库的自定义修改（如 cron 表达式、patch 等）
          if ! git merge --ff-only "upstream/${UPSTREAM_BRANCH}" 2>/dev/null; then
            # -X ours 只能自动解决内容冲突，无法处理 modify/delete（上游删、本地改）
            # 这类冲突。合并若因冲突失败，则统一按“保留本地版本”收尾：
            # 暂存当前工作树（HEAD 版本已保留在树中）后提交，完成合并。
            if ! git merge --no-edit -X ours "upstream/${UPSTREAM_BRANCH}"; then
              git add -A
              git commit --no-edit
            fi
          fi

          # 默认 GITHUB_TOKEN（GitHub App 身份）没有 workflows 权限，push 若包含对
          # .github/workflows/ 的任何增删改会被拒绝。本 fork 只需同步签到代码，
          # 因此始终把 workflows 目录恢复成本仓库自己的版本，不吸收上游的工作流改动。
          git checkout "${pre_merge}" -- .github/workflows
          git add .github/workflows
          if ! git diff --cached --quiet; then
            git commit -m "chore(sync): 保留本仓库工作流，忽略上游 .github/workflows 改动"
          fi

          origin_head="$(git rev-parse "origin/${UPSTREAM_BRANCH}")"
          local_head="$(git rev-parse "HEAD")"

          if [ "${origin_head}" = "${local_head}" ]; then
            echo "Already up to date."
            exit 0
          fi

          git push origin "HEAD:${UPSTREAM_BRANCH}"
